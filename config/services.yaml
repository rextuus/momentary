# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.path.jellyfin_uploads: '%kernel.project_dir%/storage/jellyfin/uploads'
    env(JELLYFIN_HOST): 'http://localhost:8096'
    # Ablage der Whisper-Modelle (einmalig ~0,5–1,6 GB je Modell); var/ ist im Container ein Volume
    env(WHISPER_MODELS_DIR): '%kernel.project_dir%/var/whisper-models'
    # face-service (InsightFace) im Docker-Netz; Timeout schließt das Warten auf eine laufende Anfrage ein
    env(FACE_SERVICE_URL): 'http://face-service:8000'
    env(FACE_SERVICE_TIMEOUT): '60'
    # Anbieter der Gesichtserkennung: insightface (face-service) oder rekognition (AWS, kostet)
    env(FACE_RECOGNITION_PROVIDER): 'insightface'
    # Vorfilter mit kleiner Detektionsgröße (z. B. 320); 0 = aus
    env(FACE_PREFILTER_DET_SIZE): '0'
    # Abgleich neuer Gesichter: höchstens so viele Referenzgesichter je Person
    env(FACE_MATCH_REFERENCES_PER_PERSON): '20'
    # Worker-Status (Admin → Warteschlange, Dashboard); leer = abgeschaltet
    env(RABBITMQ_MANAGEMENT_URL): 'http://rabbitmq:15672'
    env(RABBITMQ_USER): 'guest'
    env(RABBITMQ_PASS): 'guest'
    app.frame_analysis_fps: 0.2
    app.min_scene_length_for_refinement: 2.0
    app.refined_frame_analysis_fps: 1.0
    imgproxy_key: '%env(IMGPROXY_KEY)%'
    imgproxy_salt: '%env(IMGPROXY_SALT)%'
    imgproxy_public_host: '%env(IMGPROXY_PUBLIC_HOST)%'
    app.internal_api_host: 'http://app'
    # SFTP-Upload-Verzeichnisse; der FTP-Datei-Manager verschiebt daraus in den Import-Ordner (storage/imports)
    app.ftp_source_dirs:
        - '/var/www/html/storage/jellyfin/uploads'
        - '/var/www/html/storage/app_uploads'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\ImageFileService:
        arguments:
            $filesystem: '@video.storage'
            $pathProvider: '@App\Service\Storage\StoragePathProvider'

    App\Service\VideoFileService:

    Meilisearch\Client:
        arguments:
            $url: '%env(MEILISEARCH_URL)%'
            $apiKey: '%env(MEILI_MASTER_KEY)%'

    App\Command\ShowVideoProcessingPipelineCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'