framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'amqp://guest:guest@rabbitmq:5672/%2f/messages_failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Message\FrameAnalyzerMessage: async
            App\Message\SplitVideoIntoFramesMessage: async
            App\Message\DetectVideoScenesMessage: async
            App\Message\OptimizeVideoForJellyfinMessage: async
            App\Message\ExportVideoToJellyfinMessage: async
            App\Message\ExtractThumbnailMessage: async
            App\Message\ExtractSceneThumbnailMessage: async
            App\Message\ExtractAllSceneThumbnailsMessage: async
            App\Message\IndexVideoMessage: async
            App\Message\TagScenesMessage: async
            App\Message\AnalyzeSceneMessage: async
            App\Message\TestMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
