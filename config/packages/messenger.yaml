framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: '%env(MESSENGER_TRANSPORT_DSN)%'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Message\ConvertVideoMessage: async
            App\Message\FrameAnalyzerMessage: async
            App\Message\SplitVideoIntoFramesMessage: async
            App\Message\DetectVideoScenesMessage: async
            App\Message\ExportVideoToJellyfinMessage: async
            App\Message\ExtractThumbnailMessage: async
            App\Message\ExtractSceneThumbnailMessage: async
            App\Message\ExtractAllSceneThumbnailsMessage: async
            App\Message\IndexVideoMessage: async
            App\Message\TagScenesMessage: async
            App\Message\GenerateChaptersMessage: async
            App\Message\AnalyzeSceneMessage: async
            App\Message\TestMessage: async
            App\Service\Video\Processing\Message\AnalyzeFirstFrameStepMessage: async
            App\Service\Video\Processing\Message\AnalyzeFrameStepMessage: async
            App\Service\Video\Processing\Message\AnalyzeLastFrameStepMessage: async
            App\Service\Video\Processing\Message\ConvertStepMessage: async
            App\Service\Video\Processing\Message\ExtractFirstSceneThumbnailStepMessage: async
            App\Service\Video\Processing\Message\ExtractLastSceneThumbnailStepMessage: async
            App\Service\Video\Processing\Message\ExtractSceneThumbnailStepMessage: async
            App\Service\Video\Processing\Message\SceneDetectionStepMessage: async
            App\Service\Video\Processing\Message\SplitInFramesStepMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
