framework:
    workflows:
        video_processing:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\Video
            initial_marking: !php/const App\Enum\VideoStatus::PENDING
            places:
                - !php/const App\Enum\VideoStatus::PENDING
                - !php/const App\Enum\VideoStatus::CONVERTING
                - !php/const App\Enum\VideoStatus::SCENE_DETECTION
                - !php/const App\Enum\VideoStatus::EXTRACTING_THUMBNAILS
                - !php/const App\Enum\VideoStatus::VIDEO_SPLITTING
                - !php/const App\Enum\VideoStatus::ANALYZING_FACES_INITIAL
                - !php/const App\Enum\VideoStatus::REFINING_EXTRACTION
                - !php/const App\Enum\VideoStatus::REFINING_SPLITTING
                - !php/const App\Enum\VideoStatus::ANALYZING_FACES_REFINEMENT
                - !php/const App\Enum\VideoStatus::MERGING_SCENES
                - !php/const App\Enum\VideoStatus::TAGGING_SCENES
                - !php/const App\Enum\VideoStatus::CHAPTER_GENERATION
                - !php/const App\Enum\VideoStatus::EXPORTING_JELLYFIN
                - !php/const App\Enum\VideoStatus::COMPLETED
                - !php/const App\Enum\VideoStatus::ERROR
            transitions:
                start_conversion:
                    from: [!php/const App\Enum\VideoStatus::PENDING]
                    to:   !php/const App\Enum\VideoStatus::CONVERTING

                start_scene_detection:
                    from: [!php/const App\Enum\VideoStatus::CONVERTING]
                    to:   !php/const App\Enum\VideoStatus::SCENE_DETECTION

                start_extracting_thumbnails:
                    from: [!php/const App\Enum\VideoStatus::SCENE_DETECTION]
                    to:   !php/const App\Enum\VideoStatus::EXTRACTING_THUMBNAILS

                start_splitting:
                    from: [!php/const App\Enum\VideoStatus::EXTRACTING_THUMBNAILS]
                    to:   !php/const App\Enum\VideoStatus::VIDEO_SPLITTING

                start_analyzing:
                    from: [!php/const App\Enum\VideoStatus::VIDEO_SPLITTING]
                    to:   !php/const App\Enum\VideoStatus::ANALYZING_FACES_INITIAL

                start_refining_extraction:
                    from: [!php/const App\Enum\VideoStatus::ANALYZING_FACES_INITIAL]
                    to:   !php/const App\Enum\VideoStatus::REFINING_EXTRACTION

                start_refining_splitting:
                    from: [!php/const App\Enum\VideoStatus::REFINING_EXTRACTION]
                    to:   !php/const App\Enum\VideoStatus::REFINING_SPLITTING

                start_refining_analysis:
                    from: [!php/const App\Enum\VideoStatus::REFINING_SPLITTING]
                    to:   !php/const App\Enum\VideoStatus::ANALYZING_FACES_REFINEMENT

                start_merging:
                    from: [!php/const App\Enum\VideoStatus::ANALYZING_FACES_REFINEMENT]
                    to:   !php/const App\Enum\VideoStatus::MERGING_SCENES

                start_tagging:
                    from: [!php/const App\Enum\VideoStatus::MERGING_SCENES]
                    to:   !php/const App\Enum\VideoStatus::TAGGING_SCENES

                start_chapter_generation:
                    from: [!php/const App\Enum\VideoStatus::TAGGING_SCENES]
                    to:   !php/const App\Enum\VideoStatus::CHAPTER_GENERATION

                start_export:
                    from: [!php/const App\Enum\VideoStatus::CHAPTER_GENERATION]
                    to:   !php/const App\Enum\VideoStatus::EXPORTING_JELLYFIN

                complete:
                    from: [!php/const App\Enum\VideoStatus::EXPORTING_JELLYFIN]
                    to:   !php/const App\Enum\VideoStatus::COMPLETED

                fail:
                    from:
                        - !php/const App\Enum\VideoStatus::PENDING
                        - !php/const App\Enum\VideoStatus::CONVERTING
                        - !php/const App\Enum\VideoStatus::SCENE_DETECTION
                        - !php/const App\Enum\VideoStatus::EXTRACTING_THUMBNAILS
                        - !php/const App\Enum\VideoStatus::VIDEO_SPLITTING
                        - !php/const App\Enum\VideoStatus::ANALYZING_FACES_INITIAL
                        - !php/const App\Enum\VideoStatus::REFINING_EXTRACTION
                        - !php/const App\Enum\VideoStatus::REFINING_SPLITTING
                        - !php/const App\Enum\VideoStatus::ANALYZING_FACES_REFINEMENT
                        - !php/const App\Enum\VideoStatus::MERGING_SCENES
                        - !php/const App\Enum\VideoStatus::TAGGING_SCENES
                        - !php/const App\Enum\VideoStatus::CHAPTER_GENERATION
                        - !php/const App\Enum\VideoStatus::EXPORTING_JELLYFIN
                    to: !php/const App\Enum\VideoStatus::ERROR

                reset:
                    from:
                        - !php/const App\Enum\VideoStatus::CONVERTING
                        - !php/const App\Enum\VideoStatus::SCENE_DETECTION
                        - !php/const App\Enum\VideoStatus::EXTRACTING_THUMBNAILS
                        - !php/const App\Enum\VideoStatus::VIDEO_SPLITTING
                        - !php/const App\Enum\VideoStatus::ANALYZING_FACES_INITIAL
                        - !php/const App\Enum\VideoStatus::REFINING_EXTRACTION
                        - !php/const App\Enum\VideoStatus::REFINING_SPLITTING
                        - !php/const App\Enum\VideoStatus::ANALYZING_FACES_REFINEMENT
                        - !php/const App\Enum\VideoStatus::MERGING_SCENES
                        - !php/const App\Enum\VideoStatus::TAGGING_SCENES
                        - !php/const App\Enum\VideoStatus::CHAPTER_GENERATION
                        - !php/const App\Enum\VideoStatus::EXPORTING_JELLYFIN
                        - !php/const App\Enum\VideoStatus::ERROR
                    to: !php/const App\Enum\VideoStatus::PENDING