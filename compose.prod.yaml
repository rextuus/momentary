# Momentary – Produktion auf abyss, deployt über Komodo (Stack momentary, deploy/komodo/momentary.toml).
# Aufruf (Komodo macht genau das, `make prod-up` ebenso):
#   docker compose -p momentary -f compose.prod.yaml --env-file .env.prod.local up -d --build --wait
# Reihenfolge beim Start: database (gesund) → migrate (einmalig) → app (gesund) → Worker, Jellyfin.
# Secrets kommen ausschließlich aus .env.prod.local (Vorlage .env.prod.dist; Komodo schreibt die Datei bei jedem
# Deploy aus den im UI hinterlegten Variablen). Ablauf: documentation/deployment.md.
#
# Daten liegen nie im Stack-Ordner (Komodo kann ihn neu klonen): Medien und API-Schlüssel unter /srv/momentary,
# alles andere in Volumes mit festem Namen. Das Netz momentary_momentary-network nutzt der Hub (momentary-hub).
name: momentary

# Docker-Logs begrenzen: je Dienst höchstens 5 × 10 MB
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: momentary-app:prod
  # Selbst gebaut, nie aus einer Registry: `docker compose pull` (Komodo „Pull Images“) überspringt den Dienst.
  pull_policy: build
  restart: unless-stopped
  logging: *logging
  environment:
    APP_ENV: prod
    APP_DEBUG: "0"
    APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt in .env.prod.local}
    APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL fehlt in .env.prod.local}
    SYMFONY_TRUSTED_PROXIES: ${REVERSE_PROXY_IPS:-PRIVATE_SUBNETS}
    DATABASE_URL: mysql://${MYSQL_USER:-momentary}:${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt}@database:3306/${MYSQL_DATABASE:-momentary_prod}?serverVersion=8.4.11&charset=utf8mb4
    MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-momentary}:${RABBITMQ_PASS:?RABBITMQ_PASS fehlt}@rabbitmq:5672/%2f/messages
    RABBITMQ_USER: ${RABBITMQ_USER:-momentary}
    RABBITMQ_PASS: ${RABBITMQ_PASS}
    MEILISEARCH_URL: http://meilisearch:7700
    MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY fehlt}
    IMGPROXY_KEY: ${IMGPROXY_KEY:?IMGPROXY_KEY fehlt}
    IMGPROXY_SALT: ${IMGPROXY_SALT:?IMGPROXY_SALT fehlt}
    IMGPROXY_PUBLIC_HOST: ${IMGPROXY_PUBLIC_HOST:-${APP_PUBLIC_URL}/imgproxy}
    JELLYFIN_HOST: http://jellyfin:8096
    FACE_SERVICE_URL: http://face-service:8000
    FACE_SERVICE_TIMEOUT: ${FACE_SERVICE_TIMEOUT:-60}
    FACE_RECOGNITION_PROVIDER: ${FACE_RECOGNITION_PROVIDER:-insightface}
    FACE_PREFILTER_DET_SIZE: ${FACE_PREFILTER_DET_SIZE:-0}
    FACE_MATCH_REFERENCES_PER_PERSON: ${FACE_MATCH_REFERENCES_PER_PERSON:-20}
    JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
    AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
    AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
    AWS_REGION: ${AWS_REGION:-eu-central-1}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:?OAUTH_ENCRYPTION_KEY fehlt}
    OAUTH_PASSPHRASE: ${OAUTH_PASSPHRASE:-}
    JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
    # Mailversand (Secret, da Zugangsdaten enthalten sein können). null://null = keine Mails.
    MAILER_DSN: ${MAILER_DSN:-null://null}
    GEOCODING_ENABLED: ${GEOCODING_ENABLED:-1}
    IMPORT_FOLDER_WATCH: ${IMPORT_FOLDER_WATCH:-0}
    PYTHON_BINARY: /usr/bin/python3
    STORAGE_ROOT: storage
    WHISPER_MODELS_DIR: /var/www/html/var/whisper-models
  volumes:
    # Medien (Videos, Fotos, Gesichter, Import-Ordner). Host-Ordner muss existieren (einmalig anlegen,
    # documentation/deployment.md) – Docker legt ihn absichtlich nicht still an.
    - type: bind
      source: ${STORAGE_DIR:-/srv/momentary/storage}
      target: /var/www/html/storage
      bind:
        create_host_path: false
    # Schlüsselpaare für OAuth2 (API-Clients) und JWT: <KEYS_DIR>/oauth2, <KEYS_DIR>/jwt. Der Entrypoint kopiert sie
    # mit den nötigen Rechten nach config/.
    - type: bind
      source: ${KEYS_DIR:-/srv/momentary/keys}
      target: /run/momentary-keys
      read_only: true
      bind:
        create_host_path: false
    - whisper_models:/var/www/html/var/whisper-models
  networks:
    - momentary-network

# Gesund, solange der Worker die Datenbank erreicht. Als www-data, damit kein root-eigener Cache entsteht.
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "setpriv", "--reuid=www-data", "--regid=www-data", "--init-groups",
         "php", "bin/console", "dbal:run-sql", "--no-interaction", "SELECT 1"]
  interval: 60s
  timeout: 15s
  retries: 3
  start_period: 30s

# Worker starten erst nach den Migrationen und wenn app läuft (app richtet beim Start die Rechte im Speicher ein).
x-after-app: &after-app
  migrate:
    condition: service_completed_successfully
  rabbitmq:
    condition: service_healthy
  app:
    condition: service_healthy

services:
  # Einmalig bei jedem Deploy: Datenbank migrieren. Beendet sich mit 0; in Komodo unter ignore_services.
  # Schlägt die Migration fehl, starten app und Worker nicht (Rollback: documentation/deployment.md).
  migrate:
    <<: *app
    restart: "no"
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    depends_on:
      database:
        condition: service_healthy

  app:
    <<: *app
    ports:
      # Der einzige Host-Port des Stacks: Weboberfläche, API und Bilder (/imgproxy/). Nur auf der WireGuard-Adresse
      # (HTTP_BIND), dorthin leitet der Caddy auf dem VPS weiter.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8194}:80"
    # Prüft den ganzen Weg, den auch der VPS nimmt: Apache → PHP → Datenbank.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      imgproxy:
        condition: service_healthy

  # Video-Pipeline, Fotos, Import, Zeitplan
  messenger-worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "async", "async_video_processing", "photos", "scheduler_default",
              "--time-limit=3600", "--memory-limit=512M"]
    healthcheck: *worker-healthcheck
    depends_on: *after-app

  # Ton-Transkription (Whisper, CPU-lastig): eigene Queue, ein Job zur Zeit, niedrige Priorität
  transcription-worker:
    <<: *app
    command: ["nice", "-n", "15", "php", "bin/console", "messenger:consume", "transcription",
              "--time-limit=7200", "--memory-limit=512M"]
    healthcheck: *worker-healthcheck
    depends_on: *after-app

  # Gesichtserkennung (InsightFace, CPU), docs: documentation/face_recognition.md. Ein Bild zur Zeit.
  face-service:
    build:
      context: face-service
    image: momentary-face:prod
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    environment:
      FACE_DET_SIZE: ${FACE_DET_SIZE:-640}
      FACE_MIN_DET_SCORE: ${FACE_MIN_DET_SCORE:-0.5}
      FACE_INTRA_OP_THREADS: ${FACE_INTRA_OP_THREADS:-2}
      FACE_INTER_OP_THREADS: ${FACE_INTER_OP_THREADS:-1}
    # Kein Port nach außen: Nur app und die Worker sprechen den Dienst über http://face-service:8000 an.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Erster Start lädt die Modelle (ca. 280 MB) ins Volume face_models
      start_period: 300s
    # Die Inferenz darf die anderen Projekte auf dem Host nicht ausbremsen: höchstens 2 Kerne und 2 GB, und bei
    # Konkurrenz um die CPU nur halbes Gewicht (Standard 1024).
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    volumes:
      - face_models:/models
    networks:
      - momentary-network

  database:
    image: mysql:8.4.13
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-momentary_prod}
      MYSQL_USER: ${MYSQL_USER:-momentary}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw
    networks:
      - momentary-network

  # Warteschlangen. Kein Port nach außen; Verwaltung per
  # `docker compose … exec rabbitmq rabbitmqctl list_queues name messages`.
  rabbitmq:
    image: rabbitmq:3.13.7-management
    # Fester Hostname: RabbitMQ legt seine Daten unter rabbit@<hostname> ab, sonst sind sie nach jedem Neuanlegen weg
    hostname: rabbitmq
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-momentary}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS fehlt}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - momentary-network

  # Suche. Index lässt sich jederzeit neu aufbauen (app:meilisearch:index-all), wird nicht gesichert.
  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    restart: unless-stopped
    logging: *logging
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY fehlt}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      # Ältere Datenbestände beim Start auf die neue Version heben
      MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - momentary-network

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.18
    restart: unless-stopped
    logging: *logging
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?IMGPROXY_KEY fehlt}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?IMGPROXY_SALT fehlt}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /public
      IMGPROXY_ALLOW_ORIGIN: "*"
      IMGPROXY_WORKERS: "2"
    # Kein Port nach außen: Browser kommen über app (/imgproxy/) hierher
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - type: bind
        source: ${STORAGE_DIR:-/srv/momentary/storage}
        target: /public
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - momentary-network

  # Ziel des Video-Exports (Pipeline-Schritt „Upload to Jellyfin“). Kein Port nach außen; die App spricht es intern
  # über http://jellyfin:8096 an. Healthcheck bringt das Image selbst mit.
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    restart: unless-stopped
    logging: *logging
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      # Unterordner des Medienspeichers; app legt ihn beim Start an, deshalb startet Jellyfin erst danach.
      - ${STORAGE_DIR:-/srv/momentary/storage}/jellyfin/uploads:/uploads
    depends_on:
      app:
        condition: service_healthy
    networks:
      - momentary-network

  # Datenbank-Dump nach BACKUP_DIR (Standard /srv/momentary/backups), mit Rotation (deploy/komodo/db-backup.sh).
  # Startet nie von selbst (Profil), nur per `docker compose run --rm backup <anlass>`: vor jedem Deploy
  # (pre-deploy.sh), täglich über die Komodo-Procedure momentary-backup (Anlass daily), oder von Hand.
  backup:
    image: mysql:8.4.13
    profiles: ["backup"]
    restart: "no"
    logging: *logging
    entrypoint: ["sh", "/usr/local/bin/momentary-db-backup"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-momentary_prod}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./deploy/komodo/db-backup.sh:/usr/local/bin/momentary-db-backup:ro
      - type: bind
        source: ${BACKUP_DIR:-/srv/momentary/backups}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy
    networks:
      - momentary-network

# Feste Namen, damit die Daten nicht am Projektnamen hängen. Niemals umbenennen. VOLUME_PREFIX nur für Probeläufe
# setzen (z. B. momentaryprobe): Die Entwicklungsumgebung (compose.yaml) heißt ebenfalls momentary und hat
# Volumes wie momentary_database_data – ein Probelauf ohne Präfix würde sie benutzen und `down -v` sie löschen.
volumes:
  database_data:
    name: ${VOLUME_PREFIX:-momentary}_database_data
  rabbitmq_data:
    name: ${VOLUME_PREFIX:-momentary}_rabbitmq_data
  meilisearch_data:
    name: ${VOLUME_PREFIX:-momentary}_meilisearch_data
  jellyfin_config:
    name: ${VOLUME_PREFIX:-momentary}_jellyfin_config
  jellyfin_cache:
    name: ${VOLUME_PREFIX:-momentary}_jellyfin_cache
  whisper_models:
    name: ${VOLUME_PREFIX:-momentary}_whisper_models
  # InsightFace-Modelle; lassen sich jederzeit neu laden, werden nicht gesichert
  face_models:
    name: ${VOLUME_PREFIX:-momentary}_face_models

networks:
  # Fester Name: Der Hub (momentary-hub) hängt sich als externes Netz daran.
  momentary-network:
    name: ${VOLUME_PREFIX:-momentary}_momentary-network
    driver: bridge
