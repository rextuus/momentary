; Große Videos kommen als ein einziger Upload.
upload_max_filesize = 10G
post_max_size = 10G
memory_limit = 512M
max_execution_time = 3600
max_input_time = 3600
output_buffering = 4096
date.timezone = Europe/Berlin
expose_php = Off
; Umgebungsvariablen des Containers (compose) auch unter Apache in $_ENV – sonst gewinnen die Platzhalter aus .env
variables_order = "EGPCS"
