# Momentary – Apache im app-Container (Port 80). Von außen kommt man über den Caddy auf dem VPS hierher.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Videos werden als Ganzes hochgeladen; die Grenze setzt PHP (conf.d/app.ini).
    LimitRequestBody 0

    # Bilder: Browser laden signierte imgproxy-URLs unter <öffentliche Adresse>/imgproxy/ (IMGPROXY_PUBLIC_HOST).
    # So braucht imgproxy keinen eigenen Port nach außen.
    ProxyPass /imgproxy/ http://imgproxy:8080/
    ProxyPassReverse /imgproxy/ http://imgproxy:8080/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
