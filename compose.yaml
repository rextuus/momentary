services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_HOST_BINDING:-127.0.0.1}:${APP_PORT:-8088}:80"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}?serverVersion=8.0.32&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/%2f/messages"
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      JELLYFIN_HOST: ${JELLYFIN_HOST:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      IMGPROXY_HOST: ${IMGPROXY_HOST:-http://imgproxy:8080}
      IMGPROXY_PUBLIC_HOST: ${IMGPROXY_PUBLIC_HOST}
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_FACE_MATCH_THRESHOLD: ${AWS_FACE_MATCH_THRESHOLD:-80.0}
      AWS_MAX_FACES: ${AWS_MAX_FACES:-15}
      AWS_QUALITY_FILTER: ${AWS_QUALITY_FILTER:-AUTO}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      API_KEY: ${API_KEY}
      PYTHON_BINARY: ${PYTHON_BINARY:-/usr/bin/python3}
    volumes:
      # Code-Mount: Nur in DEV aktiv (wird via ENV überschrieben)
      - ${APP_CODE_VOLUME:-./:/var/www/html:rw}
      - ./media/images:/var/www/html/media/images
      - app_var:/var/www/html/var
      - ./docker/jellyfin/uploads:/var/www/html/docker/jellyfin/uploads:rw
      - ./var/uploads/app_uploads:/var/www/html/var/uploads/app_uploads
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - momentary-network

  messenger-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: always
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=512M"]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}?serverVersion=8.0.32&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/%2f/messages"
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      JELLYFIN_HOST: ${JELLYFIN_HOST:-http://jellyfin:8096}  # <-- Neu hinzugefügt
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}                  # <-- Neu hinzugefügt
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_FACE_MATCH_THRESHOLD: ${AWS_FACE_MATCH_THRESHOLD:-80.0}
      AWS_MAX_FACES: ${AWS_MAX_FACES:-15}
      AWS_QUALITY_FILTER: ${AWS_QUALITY_FILTER:-AUTO}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PYTHON_BINARY: ${PYTHON_BINARY:-/usr/bin/python3}      # <-- Neu hinzugefügt
    volumes:
      - ${APP_CODE_VOLUME:-./:/var/www/html:rw}
      - ./media/images:/var/www/html/media/images
      - app_var:/var/www/html/var
      - ./docker/jellyfin/uploads:/var/www/html/docker/jellyfin/uploads:rw # <-- Neu hinzugefügt
      - ./var/uploads/app_uploads:/var/www/html/var/uploads/app_uploads
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - momentary-network

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw
    networks:
      - momentary-network

  jellyfin:
    image: jellyfin/jellyfin
    container_name: momentary_jellyfin
    restart: unless-stopped
    ports:
      - "${JELLYFIN_HOST_BINDING:-127.0.0.1}:${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./docker/jellyfin/config:/config
      - ./docker/jellyfin/cache:/cache
      - ./docker/jellyfin/uploads:/uploads
    networks:
      - momentary-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: momentary_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_HOST_BINDING:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - momentary-network

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: momentary_meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=${MEILI_ENV:-production}
    volumes:
      - ./docker/meilisearch/data:/meili_data
    networks:
      - momentary-network

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /public
      IMGPROXY_ALLOW_ORIGIN: "*"
    ports:
      - "${IMGPROXY_HOST_BINDING:-127.0.0.1}:${IMGPROXY_PORT:-8081}:8080"
    volumes:
      - ./media/images:/public/media/images:ro
    networks:
      - momentary-network

  sftp:
    image: atmoz/sftp
    container_name: momentary_sftp
    restart: unless-stopped
    ports:
      - "2222:22"
    environment:
      # Format: benutzername:passwort:uid:gid:ordner
      SFTP_USERS: "uploaduser:MeinSicheresPasswort123:1000:33:upload"
    volumes:
      # Bindet das Upload-Verzeichnis direkt in den SFTP-Ordner des Benutzers ein
      - ./docker/jellyfin/uploads:/home/uploaduser/upload/jellyfin_uploads
      - ./var/uploads/app_uploads:/home/uploaduser/upload/app_uploads
    networks:
      - momentary-network

volumes:
  database_data:
  rabbitmq_data:
  app_var:

networks:
  momentary-network:
    driver: bridge