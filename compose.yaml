# Momentary – lokale Entwicklung (Code wird eingebunden). Produktion: compose.prod.yaml, documentation/deployment.md.
# Werte kommen aus .env (Vorlage .env.example).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# app und beide Worker nutzen dasselbe Image (wird nur einmal gebaut)
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: momentary-app:dev
  logging: *logging
  environment: &app-env
    APP_ENV: ${APP_ENV:-dev}
    APP_DEBUG: ${APP_DEBUG:-1}
    APP_SECRET: ${APP_SECRET}
    DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}?serverVersion=8.4.11&charset=utf8mb4"
    MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/%2f/messages"
    MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
    MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    JELLYFIN_HOST: ${JELLYFIN_HOST:-http://jellyfin:8096}
    FACE_SERVICE_URL: ${FACE_SERVICE_URL:-http://face-service:8000}
    FACE_SERVICE_TIMEOUT: ${FACE_SERVICE_TIMEOUT:-60}
    FACE_RECOGNITION_PROVIDER: ${FACE_RECOGNITION_PROVIDER:-insightface}
    FACE_PREFILTER_DET_SIZE: ${FACE_PREFILTER_DET_SIZE:-0}
    FACE_MATCH_REFERENCES_PER_PERSON: ${FACE_MATCH_REFERENCES_PER_PERSON:-20}
    JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
    IMGPROXY_PUBLIC_HOST: ${IMGPROXY_PUBLIC_HOST}
    IMGPROXY_KEY: ${IMGPROXY_KEY}
    IMGPROXY_SALT: ${IMGPROXY_SALT}
    AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
    AWS_SECRET_KEY: ${AWS_SECRET_KEY}
    AWS_REGION: ${AWS_REGION:-eu-central-1}
    GEMINI_API_KEY: ${GEMINI_API_KEY}
    PYTHON_BINARY: /usr/bin/python3
    STORAGE_ROOT: storage
  volumes:
    - ./:/var/www/html:rw
    - app_var:/var/www/html/var
    - ./storage:/var/www/html/storage:rw
  depends_on:
    database:
      condition: service_healthy
    rabbitmq:
      condition: service_started
  networks:
    - momentary-network

services:
  app:
    <<: *app
    restart: unless-stopped
    command: ["sh", "-c", "mkdir -p var/cache var/log storage/imports && chown -R www-data:www-data /var/www/html/var /var/www/html/storage && chmod -R 775 /var/www/html/var /var/www/html/storage && apache2-foreground"]
    ports:
      - "${APP_HOST_BINDING:-127.0.0.1}:${APP_PORT:-8088}:80"

  messenger-worker:
    <<: *app
    user: www-data
    restart: always
    command: ["sh", "-c", "php bin/console cache:clear && exec php bin/console messenger:consume async async_video_processing photos scheduler_default --time-limit=3600 --memory-limit=512M"]

  # Ton-Transkription (Whisper, CPU-lastig): eigene Queue, ein Job zur Zeit, niedrige Priorität
  transcription-worker:
    <<: *app
    user: www-data
    restart: always
    command: ["sh", "-c", "sleep 20 && exec nice -n 15 php bin/console messenger:consume transcription --time-limit=7200 --memory-limit=512M"]
    environment:
      <<: *app-env
      WHISPER_MODELS_DIR: /var/www/html/var/whisper-models

  # Gesichtserkennung (InsightFace, CPU), docs: documentation/face_recognition.md. Ein Bild zur Zeit.
  face-service:
    build:
      context: face-service
    image: momentary-face:dev
    restart: unless-stopped
    logging: *logging
    environment:
      FACE_DET_SIZE: ${FACE_DET_SIZE:-640}
      FACE_MIN_DET_SCORE: ${FACE_MIN_DET_SCORE:-0.5}
      FACE_INTRA_OP_THREADS: ${FACE_INTRA_OP_THREADS:-2}
      FACE_INTER_OP_THREADS: ${FACE_INTER_OP_THREADS:-1}
    # Kein Port nach außen: Nur app und die Worker sprechen den Dienst über http://face-service:8000 an.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Erster Start lädt die Modelle (ca. 280 MB) ins Volume face_models
      start_period: 300s
    # Die Inferenz darf die anderen Projekte auf dem Host nicht ausbremsen: höchstens 2 Kerne und 2 GB, und bei
    # Konkurrenz um die CPU nur halbes Gewicht (Standard 1024).
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    volumes:
      - face_models:/models
    networks:
      - momentary-network

  database:
    image: mysql:8.4.11
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw
    networks:
      - momentary-network

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: momentary_jellyfin
    restart: unless-stopped
    logging: *logging
    ports:
      - "${JELLYFIN_HOST_BINDING:-127.0.0.1}:${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./docker/jellyfin/config:/config
      - ./docker/jellyfin/cache:/cache
      - ./storage/jellyfin/uploads:/uploads
    networks:
      - momentary-network

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: momentary_rabbitmq
    # Fester Hostname: RabbitMQ legt seine Daten unter rabbit@<hostname> ab
    hostname: rabbitmq
    restart: unless-stopped
    logging: *logging
    ports:
      - "${RABBITMQ_HOST_BINDING:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - momentary-network

  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    container_name: momentary_meilisearch
    restart: unless-stopped
    logging: *logging
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./docker/meilisearch/data:/meili_data
    networks:
      - momentary-network

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.18
    restart: unless-stopped
    logging: *logging
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /public
      IMGPROXY_ALLOW_ORIGIN: "*"
    ports:
      - "${IMGPROXY_HOST_BINDING:-127.0.0.1}:${IMGPROXY_PORT:-8081}:8080"
    volumes:
      - ./storage:/public:ro
    networks:
      - momentary-network

  sftp:
    image: atmoz/sftp:debian
    container_name: momentary_sftp
    restart: unless-stopped
    logging: *logging
    ports:
      - "${SFTP_HOST_BINDING:-0.0.0.0}:${SFTP_PORT:-2222}:22"
    environment:
      SFTP_USERS: "uploaduser:${SFTP_PASSWORD:-MeinSicheresPasswort123}:1000:33:upload"
    volumes:
      - ./storage/jellyfin/uploads:/home/uploaduser/upload/jellyfin_uploads
      - ./storage/app_uploads:/home/uploaduser/upload/app_uploads
      # Import-Ordner: Videos und Fotos hier ablegen, Übernahme unter Verwalten → Import-Ordner
      - ./storage/imports:/home/uploaduser/upload/import
    networks:
      - momentary-network

volumes:
  database_data:
  rabbitmq_data:
  app_var:
  face_models:

networks:
  momentary-network:
    driver: bridge
